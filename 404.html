<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page not found - HireReady</title>
    <meta name="description" content="That page does not exist on HireReady." />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#f4f2ec" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <script src="/theme-init.js"></script>
    <script type="module" src="/src/entries/landing.ts"></script>
  </head>

  <body>
    <header class="site-header" data-site-header>
      <div class="container site-header__inner">
        <a class="brand" href="/">
          <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <rect width="32" height="32" rx="4" fill="var(--ink)" />
            <path d="M8.5 9V23M17.5 9V23" fill="none" stroke="var(--paper)" stroke-width="2.6" stroke-linecap="round" />
            <path d="M8.5 16h9" fill="none" stroke="var(--paper)" stroke-width="2.6" stroke-linecap="round" />
            <circle cx="23.5" cy="22" r="3.2" fill="var(--mark)" />
          </svg>
          <span>Hire<em>Ready</em></span>
        </a>
        <nav class="site-nav" aria-label="Main">
          <button
            class="icon-btn theme-toggle"
            type="button"
            data-theme-toggle
            aria-label="Switch to dark theme"
            aria-pressed="false"
          >
            <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4" />
            </svg>
            <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>
        </nav>
      </div>
    </header>

    <main id="main">
      <div class="container error-page">
        <p class="error-page__code">404</p>
        <h1>That page does not exist</h1>
        <p>
          The link may be old, or slightly mistyped. The checker itself is one click away.
        </p>
        <div class="error-page__actions">
          <a class="btn btn--primary" href="/resume-score">Check my resume</a>
          <a class="btn btn--secondary" href="/">Back to the homepage</a>
        </div>
      </div>
    </main>
  </body>
</html>
